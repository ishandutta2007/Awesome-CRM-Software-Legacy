<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Background Dynamic Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
    }
    
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }

    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
    }

    @keyframes dashOffset {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: center; }
    .bg-card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .bg-card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .dynamic-line { stroke-dasharray: 10 5; animation: dashOffset 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Glowing Background Orbs (Behind content) -->
  <circle class="orb-1" cx="200" cy="80" r="140" fill="#3b82f6" filter="blur(60px)" opacity="0.3" />
  <circle class="orb-2" cx="1000" cy="220" r="160" fill="#8b5cf6" filter="blur(70px)" opacity="0.3" />

  <!-- Background Decorative Dynamic Elements (Low Opacity, Positioned to not overlap main text) -->
  <g class="bg-card-1" opacity="0.25">
    <rect x="850" y="40" width="280" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <line x1="880" y1="70" x2="1000" y2="70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <line x1="880" y1="95" x2="1080" y2="95" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="880" y1="115" x2="1020" y2="115" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <circle cx="1080" cy="70" r="12" fill="#22c55e" />
  </g>

  <g class="bg-card-2" opacity="0.2">
    <rect x="900" y="160" width="240" height="100" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 930 230 L 970 200 L 1010 215 L 1090 180" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <circle cx="1090" cy="180" r="5" fill="#c084fc" />
  </g>

  <!-- Decorative Grid Grid Lines -->
  <path class="dynamic-line" d="M 0 150 Q 300 250 600 150 T 1200 150" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Foreground Content (Guaranteed high visibility) -->
  <g transform="translate(60, 0)">
    <!-- Badge / Tag -->
    <g transform="translate(0, 50)">
      <rect width="210" height="32" rx="16" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1"/>
      <text x="15" y="21" class="tag">🚀 CRM Modernization &amp; Migration</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#glow)">Awesome CRM Software Legacy</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">Curated On-Premises CRM Platforms, Modern SaaS &amp; Open-Source Alternatives</text>

    <!-- Decorative Badges / Indicators -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="14" cy="14" r="5" fill="#ef4444" />
      <text x="28" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">Legacy Systems</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="156" cy="14" r="5" fill="#22c55e" />
      <text x="170" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">Open-Source CRMs</text>

      <!-- Pill 3 -->
      <rect x="299" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="313" cy="14" r="5" fill="#3b82f6" />
      <text x="327" y="18" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">SaaS Products</text>
    </g>
  </g>
</svg>
